batch_size: 1
config: configs/iclm_cloze_prompt_nat.yaml
data_path:
- data/NEG-136-NAT-NT.tsv
- data/NEG-136-NAT-LN.tsv
device: cuda
experiment_dir: experiments/iclm_cloze_prompt_nat
model_type:
- ICLM
prediction_dir: experiments/iclm_cloze_prompt_nat/predictions
prompt_template: 'Complete the sentence below with only one word.\nSentence: "{context} ___."'
assistant_message_template: 'Completed sentence: {context}'
scoring_method: distribution
skip_if_exists: true
topk: 30
